<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification | Subiksha Makeup Academy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            overflow: hidden;
        }

        .header {
            background: #111111;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.85;
        }

        .content {
            padding: 35px;
        }

        .status {
            text-align: center;
            margin-bottom: 30px;
        }

        .check {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #e7f7ed;
            color: #16833b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        .valid {
            color: #16833b;
            font-size: 24px;
            font-weight: bold;
        }

        .subtitle {
            color: #666;
            margin-top: 7px;
            font-size: 14px;
        }

        .details {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            overflow: hidden;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 16px 18px;
            border-bottom: 1px solid #eeeeee;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }

        .value {
            text-align: right;
            font-weight: 600;
            font-size: 14px;
        }

        .verified {
            color: #16833b;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #fafafa;
            border-top: 1px solid #eeeeee;
            color: #777;
            font-size: 13px;
        }

        .verification-id {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .verification-id strong {
            color: #222;
        }

        .invalid {
            text-align: center;
            padding: 30px 10px;
        }

        .invalid-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .invalid h2 {
            color: #c62828;
            margin-bottom: 10px;
        }

        .invalid p {
            color: #666;
            line-height: 1.6;
        }

        @media (max-width: 550px) {
            .content {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 23px;
            }

            .row {
                flex-direction: column;
                gap: 6px;
            }

            .value {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Subiksha Makeup Academy</h1>
        <p>Certificate Verification Portal</p>
    </div>

    <div class="content" id="verificationContent">
        <!-- Certificate information will appear here -->
    </div>

    <div class="footer">
        This page is provided for certificate verification purposes.
    </div>

</div>

<script>

    /*
     * Certificate Database
     *
     * The certificate number is used as the verification ID.
     *
     * Example:
     * https://kutty69.github.io/subiksha-certificate-verification/?id=1000
     */

    const certificates = {

        "1000": {
            name: "Kalliyany",
            certificateNumber: "1000",
            course: "Master Course",
            duration: "3 Months",
            trainingPeriod: "1 January 2026 – 1 March 2026",
            issueDate: "15 March 2026",
            institution: "Subiksha Makeup Academy"
        }

    };


    // Get certificate ID from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const certificateId = urlParams.get("id");

    const content = document.getElementById("verificationContent");


    // Check whether certificate exists
    if (certificateId && certificates[certificateId]) {

        const certificate = certificates[certificateId];

        content.innerHTML = `

            <div class="status">

                <div class="check">
                    ✓
                </div>

                <div class="valid">
                    Certificate Verified
                </div>

                <div class="subtitle">
                    This certificate number is registered in our verification system.
                </div>

            </div>


            <div class="details">

                <div class="row">
                    <div class="label">
                        Certificate Number
                    </div>

                    <div class="value">
                        ${certificate.certificateNumber}
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Name
                    </div>

                    <div class="value">
                        ${certificate.name}
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Course
                    </div>

                    <div class="value">
                        ${certificate.course}
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Duration
                    </div>

                    <div class="value">
                        ${certificate.duration}
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Training Period
                    </div>

                    <div class="value">
                        ${certificate.trainingPeriod}
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Issue Date
                    </div>

                    <div class="value">
                        ${certificate.issueDate}
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Institution
                    </div>

                    <div class="value">
                        ${certificate.institution}
                    </div>
                </div>


                <div class="row">
                    <div class="label">
                        Status
                    </div>

                    <div class="value verified">
                        ✓ VALID
                    </div>
                </div>

            </div>


            <div class="verification-id">
                Verification ID:
                <strong>${certificate.certificateNumber}</strong>
            </div>

        `;

    } else {

        // Certificate not found

        content.innerHTML = `

            <div class="invalid">

                <div class="invalid-icon">
                    ⚠️
                </div>

                <h2>Certificate Not Found</h2>

                <p>
                    We could not find a certificate matching the
                    verification ID provided.
                </p>

                <br>

                <p>
                    Please check the certificate number and try again.
                </p>

            </div>

        `;

    }

</script>

</body>
</html>
